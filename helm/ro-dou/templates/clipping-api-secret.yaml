{{- if .Values.clippingApi.enabled }}
{{- $fullname := include "ro-dou.fullname" . -}}
{{- $user := index .Values.postgres.secrets "postgres-user" -}}
{{- $password := index .Values.postgres.secrets "postgres-password" -}}
{{- $defaultUrl := printf "postgresql://%s:%s@%s-postgres:%v/clipping" $user $password $fullname .Values.postgres.service.port -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-clipping-api
  labels:
    {{- include "ro-dou.labels" . | nindent 4 }}
    app: clipping-api
type: Opaque
stringData:
  CLIPPING_DB_URL: {{ default $defaultUrl .Values.clippingApi.secrets.CLIPPING_DB_URL | quote }}
  AIRFLOW_API_TOKEN: {{ .Values.clippingApi.secrets.AIRFLOW_API_TOKEN | quote }}
{{- end }}
