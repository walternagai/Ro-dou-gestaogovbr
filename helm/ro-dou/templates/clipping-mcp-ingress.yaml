{{- if and .Values.clippingMcp.enabled .Values.clippingMcp.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ro-dou.fullname" . }}-clipping-mcp
  labels:
    {{- include "ro-dou.labels" . | nindent 4 }}
    app: clipping-mcp
  {{- with .Values.clippingMcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.clippingMcp.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.clippingMcp.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.clippingMcp.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "ro-dou.fullname" $ }}-clipping-mcp
                port:
                  number: {{ $.Values.clippingMcp.port }}
          {{- end }}
    {{- end }}
{{- end }}
