{{- if .Values.clippingApi.enabled }}
{{- $fullname := include "ro-dou.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-clipping-api
  labels:
    {{- include "ro-dou.labels" . | nindent 4 }}
    app: clipping-api
spec:
  replicas: {{ .Values.clippingApi.replicas }}
  selector:
    matchLabels:
      app: clipping-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: clipping-api
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.clippingApi.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: clipping-api
          image: "{{ .Values.clippingApi.image.repository }}:{{ .Values.clippingApi.image.tag }}"
          imagePullPolicy: {{ .Values.clippingApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.clippingApi.port }}
          envFrom:
            - secretRef:
                name: {{ $fullname }}-clipping-api
          env:
            - name: AIRFLOW_API_URL
              value: {{ default (printf "http://%s-airflow-api-server:%v" $fullname .Values.airflow.apiServer.port) .Values.clippingApi.airflowApiUrl | quote }}
            {{- range $key, $value := .Values.clippingApi.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /clipping/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /clipping/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.clippingApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.clippingApi.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clippingApi.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clippingApi.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
