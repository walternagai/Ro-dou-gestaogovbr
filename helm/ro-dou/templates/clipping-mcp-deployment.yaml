{{- if .Values.clippingMcp.enabled }}
{{- $fullname := include "ro-dou.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-clipping-mcp
  labels:
    {{- include "ro-dou.labels" . | nindent 4 }}
    app: clipping-mcp
spec:
  replicas: {{ .Values.clippingMcp.replicas }}
  selector:
    matchLabels:
      app: clipping-mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: clipping-mcp
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.clippingMcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: clipping-mcp
          image: "{{ .Values.clippingMcp.image.repository }}:{{ .Values.clippingMcp.image.tag }}"
          imagePullPolicy: {{ .Values.clippingMcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.clippingMcp.port }}
          env:
            - name: CLIPPING_API_BASE_URL
              value: {{ default (printf "http://%s-clipping-api:%v" $fullname .Values.clippingApi.port) .Values.clippingMcp.apiBaseUrl | quote }}
            {{- range $key, $value := .Values.clippingMcp.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /clipping/mcp/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /clipping/mcp/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- with .Values.clippingMcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.clippingMcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clippingMcp.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clippingMcp.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
