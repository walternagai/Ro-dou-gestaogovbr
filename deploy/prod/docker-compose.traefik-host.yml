services:
  airflow-api-server:
    ports: !override []
    labels:
      traefik.enable: "true"
      traefik.docker.network: "ro-dou_default"
      traefik.http.routers.ro-dou.rule: "Host(`${RO_DOU_HOST:?Defina RO_DOU_HOST no .env.production}`)"
      traefik.http.routers.ro-dou.entrypoints: "websecure"
      traefik.http.routers.ro-dou.tls: "true"
      traefik.http.routers.ro-dou.tls.certresolver: "letsencrypt"
      traefik.http.routers.ro-dou.service: "ro-dou"
      traefik.http.services.ro-dou.loadbalancer.server.port: "8080"
      traefik.http.services.ro-dou.loadbalancer.server.scheme: "http"
      traefik.http.services.ro-dou.loadbalancer.healthcheck.path: "/api/v2/monitor/health"
      traefik.http.services.ro-dou.loadbalancer.healthcheck.interval: "30s"

  clipping-api:
    labels:
      traefik.enable: "true"
      traefik.docker.network: "ro-dou_default"
      traefik.http.routers.clipping.rule: "Host(`${RO_DOU_HOST:?Defina RO_DOU_HOST no .env.production}`) && PathPrefix(`/clipping`)"
      traefik.http.routers.clipping.priority: "100"
      traefik.http.routers.clipping.entrypoints: "websecure"
      traefik.http.routers.clipping.tls: "true"
      traefik.http.routers.clipping.tls.certresolver: "letsencrypt"
      traefik.http.routers.clipping.service: "clipping"
      traefik.http.services.clipping.loadbalancer.server.port: "8000"
      traefik.http.services.clipping.loadbalancer.healthcheck.path: "/clipping/healthz"
      traefik.http.services.clipping.loadbalancer.healthcheck.interval: "30s"

  clipping-mcp:
    labels:
      traefik.enable: "true"
      traefik.docker.network: "ro-dou_default"
      traefik.http.routers.clipping-mcp.rule: "Host(`${RO_DOU_HOST:?Defina RO_DOU_HOST no .env.production}`) && PathPrefix(`/clipping/mcp`)"
      traefik.http.routers.clipping-mcp.priority: "110"
      traefik.http.routers.clipping-mcp.entrypoints: "websecure"
      traefik.http.routers.clipping-mcp.tls: "true"
      traefik.http.routers.clipping-mcp.tls.certresolver: "letsencrypt"
      traefik.http.routers.clipping-mcp.service: "clipping-mcp"
      traefik.http.services.clipping-mcp.loadbalancer.server.port: "8000"
      traefik.http.services.clipping-mcp.loadbalancer.healthcheck.path: "/clipping/mcp/healthz"
      traefik.http.services.clipping-mcp.loadbalancer.healthcheck.interval: "30s"
